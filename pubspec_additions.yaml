# Merge these entries into your new project's pubspec.yaml.
# Do not blindly replace the whole file.

dependencies:
  get: ^4.7.3
  shared_preferences: ^2.5.3
  
  # if you need internet like Login app for CRUD and Handling_Data class
  http: ^1.6.0
  lottie: ^3.3.1
  dartz: ^0.10.1
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/pdfs/
    - assets/lottie/
    - assets/audio/
    - assets/svg/
  
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700

    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-Bold.ttf
          weight: 700





